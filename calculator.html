<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="calculator">
        <div class="result-display">
                <p class="result">0</p>
        </div>
        <div class="calculator-buttons">
            <div class="first-row">
                <button class="backspace">←</button>
                <button class="clear">C</button>
                <button class="operator percentage">%</button>
                <button class="operator divide">÷</button>
            </div>
            <div class="second-row">
                <button class="number seven">7</button>
                <button class="number eight">8</button>
                <button class="number nine">9</button>
                <button class="operator multiply">x</button>
            </div>
            <div class="third-row">
                <button class="number four">4</button>
                <button class="number five">5</button>
                <button class="number six">6</button>
                <button class="operator subtract">-</button>
            </div>
            <div class="fourth-row">
                <button class="number one">1</button>
                <button class="number two">2</button>
                <button class="number three">3</button>
                <button class="operator add">+</button>
            </div>
            <div class="fifth-row">
                <button class="operator plus-minus">±</button>       
                <button class="number zero">0</button>
                <button class="decimal">.</button>
                <button class="equals">=</button>
            </div>
        </div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
